name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/tracker-app-demo-8eowpg
      # Work in progress, built as a *separate* app so the stable one stays installed —
      # see the stamping step below.
      - claude/balance
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm install

      # Every build was versionCode 1 and version "1.0.0", so nothing on the phone could
      # say which one was installed — and "is the fix in the build you are running?" was a
      # question nobody could answer. Both now carry the run number, and the app shows them
      # in Settings.
      - name: Stamp the build number into app.json
        run: |
          # Written to a file through a quoted heredoc rather than passed to `node -e`:
          # the inline version was single-quoted, and an apostrophe in one of its own
          # comments closed the quote and handed the rest of the script to bash.
          cat > stamp-version.js <<'JS'
          const fs = require("fs");
          // The job default working-directory is already mobile-app, so this path is
          // relative to that, not to the repository root.
          const p = "app.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          const run = Number(process.env.GITHUB_RUN_NUMBER) || 0;
          j.expo.version = `1.0.${run}`;
          j.expo.android.versionCode = run;

          // A build from anywhere but the stable branch installs as its own app: its own
          // applicationId, its own name in the launcher, its own storage. Android keys
          // everything off the applicationId, so without this the test build would replace
          // the app being used every day — which is exactly what a test build must not do.
          if (process.env.GITHUB_REF_NAME !== "claude/tracker-app-demo-8eowpg") {
            j.expo.name = "Стержень (тест)";
            j.expo.android.package = "com.yourcompany.noburnout.dev";
          }

          fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          console.log("name", j.expo.name, "package", j.expo.android.package);
          console.log("version", j.expo.version, "versionCode", j.expo.android.versionCode);
          JS
          node stamp-version.js
          rm stamp-version.js

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sterzhen-apk
          path: mobile-app/${{ steps.apk.outputs.path }}

      # Test builds get their own tag prefix, so the releases page never leaves you guessing
      # which of two APKs is the one you actually use.
      - name: Name this build
        id: flavour
        run: |
          if [ "$GITHUB_REF_NAME" = "claude/tracker-app-demo-8eowpg" ]; then
            echo "tag=android-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=Стержень — сборка ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "note=Обычная сборка «Стержня»." >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=Стержень (тест) — сборка ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "note=Отдельное приложение: ставится рядом с обычным «Стержнем» и не трогает его данные." >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.flavour.outputs.tag }}
          name: ${{ steps.flavour.outputs.title }}
          body: |
            ${{ steps.flavour.outputs.note }}

            Ветка `${{ github.ref_name }}`, коммит ${{ github.sha }}.
          files: mobile-app/${{ steps.apk.outputs.path }}
