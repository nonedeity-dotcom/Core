name: E2E check — creker integration

# Manual only: boots an Android emulator, seeds creker with a known
# screen-time value via its CI-only instrumented test (SeedTestDataTest —
# lives in creker's app/src/androidTest, never ships in a real APK),
# installs the real core release APK next to it, launches it, and
# screenshots + logcats the result. This is the only way to check that data
# actually crosses from creker's ContentProvider into core's native
# module — a build succeeding proves the code compiles, not that the two
# apps can actually talk to each other on a device.
#
# Two separate jobs, not one: building core's APK (RN/Compose gradle
# cache) and running the emulator (Android SDK + a several-GB system image)
# together ran the single runner out of disk mid-emulator-setup ("No space
# left on device") — confirmed by log, not a guess. Splitting them gives
# each its own fresh runner with the full ~14GB free, connected by an
# artifact upload/download instead of sharing one disk.

on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build core release APK
        working-directory: core/mobile-app
        run: |
          npm install

          # `expo prebuild` fetches the bare-minimum template from the npm
          # registry's CDN — confirmed (via 3 genuine retries, 20s apart,
          # each an independent DNS+connection attempt) to fail 100% of the
          # time from this specific runner pool with an instant "network
          # timeout", while the very same file downloads fine from this
          # session directly. Not a flake to retry around, so instead: use
          # the exact tarball --template accepts a local file for, fetched
          # once outside CI and committed to .github/e2e-assets/. Bypasses
          # that network path entirely rather than working around it.
          #
          # expo prebuild also exits 0 even when it fails (confirmed: prints
          # "✖ Failed to create the native directory" then returns success
          # anyway) — the filesystem outcome is checked, not $?, since the
          # exit code can't be trusted.
          EXPO_OFFLINE=1 CI=1 npx expo prebuild --platform android \
            --template "$GITHUB_WORKSPACE/core/.github/e2e-assets/expo-template-bare-minimum-51.0.56.tgz"
          if [ ! -f android/settings.gradle ]; then
            echo "prebuild failed even with the cached template — see log above"
            exit 1
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Dump merged manifest for diagnosis
        working-directory: core/mobile-app
        run: |
          MANIFEST=$(find android/app/build/intermediates -iname "AndroidManifest.xml" -path "*release*" | head -n 1)
          echo "Merged manifest: $MANIFEST"
          if [ -n "$MANIFEST" ]; then
            grep -n -A2 -B2 "creker\|queries\|READ_USAGE" "$MANIFEST" || echo "no creker-related lines found in merged manifest"
          fi

      - name: Locate core APK
        id: nb_apk
        run: |
          APK=$(find core/mobile-app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" ./app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: core-apk
          path: app-release.apk
          retention-days: 1

  e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: core

      # creker is a public repo on the same account, so this needs no token —
      # a plain checkout works exactly like it would for any public repo.
      - uses: actions/checkout@v4
        with:
          repository: nonedeity-dotcom/creker
          ref: claude/creker-architecture-audit-5ismtl
          path: creker

      - uses: actions/download-artifact@v4
        with:
          name: core-apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Seed creker, install core, verify + screenshot via Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Confirmed by log: this action runs each line of `script` as its own
          # independent `sh -c` invocation, not as one cohesive script — a `cd`
          # or `export` on one line has no effect on the next line ("chmod:
          # cannot access 'gradlew'" even though the previous line was `cd
          # creker`). So every line here is self-contained: no bare `cd`, no
          # `export` relied on by a later line, no `\` continuation across
          # lines — dependent steps are chained with `&&` inside one line.
          #
          # The real bug behind every prior "checkbox never auto-ticks" run:
          # `pm list packages` right after this step showed ONLY core
          # installed — creker was gone, despite SeedTestDataTest passing
          # moments earlier. `./gradlew connectedDebugAndroidTest` (AGP's
          # standard task) installs, runs, then UNINSTALLS the app under test
          # as part of its own cleanup — wiping creker's freshly-seeded Room
          # DB with it before core ever got to query it. That's the
          # actual reason ContentResolver saw "Failed to find provider info":
          # the app genuinely wasn't there, not a package-visibility problem.
          # Fixed by building + installing creker's app and androidTest APKs
          # with plain `adb install` (persists), then running only the one
          # test class directly via `am instrument` — which does not
          # uninstall anything afterward.
          #
          # Each Maestro flow records its failure to a .status file instead
          # of aborting the step: `adb logcat -d` is the next line, and when
          # a flow aborted the step directly (run 26) the emulator was killed
          # before logcat was ever dumped — leaving the one failure with no
          # device log to diagnose it from. The last line re-raises the
          # failure once the log has been captured.
          script: |
            chmod +x creker/gradlew
            (cd creker && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon)
            adb install -r creker/app/build/outputs/apk/debug/app-debug.apk
            adb install -r creker/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.creker.screentime.SeedTestDataTest com.creker.screentime.test/androidx.test.runner.AndroidJUnitRunner
            adb install -r ./app-release.apk
            echo "=== pm list packages (creker/noburnout) ===" && adb shell pm list packages | grep -E "creker|noburnout"
            # Expected to print "No result found." now: creker decides per calling app,
            # and the shell is not one of the apps the user allowed. That is the check
            # working, not failing -- the real cross-app read is the Maestro flow below,
            # which runs as core, the one package creker allows by default. Kept
            # because a *successful* read here would mean the per-app gate is not holding.
            echo "=== adb shell content query (expected: refused, shell is not an allowed app) ===" && adb shell content query --uri content://com.creker.screentime.provider/device_usage --bind 0:s:$(date -u +%F) --bind 1:s:$(date -u +%F)
            curl -Ls "https://get.maestro.mobile.dev" | bash
            (export PATH="$PATH:$HOME/.maestro/bin" && maestro test core/mobile-app/.maestro/screentime-integration.yaml) || echo "screentime-integration FAILED" > flow-screentime.status
            (export PATH="$PATH:$HOME/.maestro/bin" && maestro test core/mobile-app/.maestro/data-backup.yaml) || echo "data-backup FAILED" > flow-backup.status
            (export PATH="$PATH:$HOME/.maestro/bin" && maestro test core/mobile-app/.maestro/library.yaml) || echo "library FAILED" > flow-library.status
            (export PATH="$PATH:$HOME/.maestro/bin" && maestro test core/mobile-app/.maestro/controls.yaml) || echo "controls FAILED" > flow-controls.status
            adb logcat -d > logcat.txt
            cat flow-screentime.status flow-backup.status flow-library.status flow-controls.status 2>/dev/null; [ ! -s flow-screentime.status ] && [ ! -s flow-backup.status ] && [ ! -s flow-library.status ] && [ ! -s flow-controls.status ]

      - name: Locate Maestro screenshots
        if: always()
        run: |
          # Confirmed by log: Maestro logged "Take screenshot today... COMPLETED"
          # yet this search still came up empty at maxdepth 4 — it saves under
          # ~/.maestro/tests/<run-timestamp>/ (nested deeper than 4, unlike the
          # top-level debug dir Maestro prints on a failed assertion), so this
          # widens the search instead of guessing a fixed depth.
          find "$HOME/.maestro" -iname "*.png" 2>/dev/null || true
          for NAME in today backup backup-share-sheet tip-1 tip-2 library focus-intervals notification-access reminders; do
            SHOT=$(find "$HOME" . -iname "$NAME.png" 2>/dev/null | head -n 1)
            echo "Found $NAME: $SHOT"
            [ -n "$SHOT" ] && cp "$SHOT" "./$NAME-screenshot.png" || true
          done

          # On a failed assertion Maestro also saves a screenshot of what was
          # actually on screen at that moment (screenshots/step-NNN-*.png).
          # Run 26's failure could not be diagnosed without it, so every png
          # under the run dir is published, named <flow>-<file> and stripped
          # of the non-ASCII characters Maestro takes from the assertion text.
          mkdir -p shots
          find "$HOME/.maestro/tests" -iname "*.png" 2>/dev/null | while read -r P; do
            FLOW=$(basename "$(dirname "$(dirname "$P")")")
            SAFE=$(printf '%s-%s' "$FLOW" "$(basename "$P")" | tr -c 'A-Za-z0-9._-' '_')
            cp "$P" "shots/$SAFE"
          done
          ls -la shots || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            *-screenshot.png
            shots/**
            logcat.txt
            creker/app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      # actions/upload-artifact puts files behind an Azure Blob Storage
      # redirect that this session's own egress policy blocks, so there is
      # no way to fetch the artifact zip from inside this session to
      # actually look at the screenshot. Pushing it to a small dedicated
      # branch instead makes it reachable through the GitHub Contents API
      # (api.github.com, which this session can reach directly) — force-push
      # so the branch holds just the latest run's screenshot, not a growing
      # history of images.
      - name: Publish screenshot + logcat to e2e-results branch for review
        if: always()
        working-directory: core
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan e2e-results
          git rm -rf . >/dev/null 2>&1 || true
          cp ../*-screenshot.png . 2>/dev/null || true
          [ -d ../shots ] && cp -r ../shots shots || true
          [ -f ../logcat.txt ] && cp ../logcat.txt logcat.txt || true
          git add -A
          git commit -m "e2e: results from run ${{ github.run_id }}"
          git push -f origin e2e-results
